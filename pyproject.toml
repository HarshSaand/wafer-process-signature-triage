[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-process-signature-triage"
version = "0.1.0"
description = "Interpretable wafer-map screening for semiconductor process-excursion analysis"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {text = "MIT"}
authors = [{name = "Harsh Saand"}]
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "Pillow>=10,<13",
  "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "joblib>=1.3,<2",
  "matplotlib>=3.8,<4", "seaborn>=0.13,<1", "torch>=2.2,<3",
  "streamlit>=1.39,<2", "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
data = ["kaggle>=1.6,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
