project:
  name: "WPST — Wafer Process Signature Triage"
  seed: 42

data:
  raw_dir: "data/raw/WM811k_Dataset"
  manifest: "data/processed/manifest.csv"
  image_size: 64
  split_fractions:
    train: 0.70
    validation: 0.15
    test: 0.15

training:
  epochs: 12
  batch_size: 64
  learning_rate: 0.002
  weight_decay: 0.0001
  checkpoint: "artifacts/model.pt"

evaluation:
  output_dir: "results"
  calibration_bins: 10

demo:
  checkpoint: "artifacts/model.pt"
  # Scenario setting only; it is not claimed as an experimentally optimized cutoff.
  review_threshold: 0.65
  similar_cases: 5
